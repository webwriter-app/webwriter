<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc">
  <title id="title">Page width allocation and reading column</title>
  <desc id="desc">A centered page has responsive gutters. A narrow reading column sits above a wide widget that fills the page content width. The widget is labelled as using the parent's allocated inline size.</desc>
  <style>
    .ink { fill: #1f2937; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #4b5563; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #075985; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .gutter { fill: #e2e8f0; }
    .prose { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; }
    .widget { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .measure { fill: none; stroke: #64748b; stroke-width: 1.5; }
  </style>
  <rect width="720" height="330" fill="#ffffff"/>
  <rect class="page" x="16" y="16" width="688" height="298" rx="12"/>
  <rect class="gutter" x="16" y="16" width="42" height="298"/>
  <rect class="gutter" x="662" y="16" width="42" height="298"/>
  <text class="small" x="37" y="165" text-anchor="middle" transform="rotate(-90 37 165)">gutter</text>
  <text class="small" x="683" y="165" text-anchor="middle" transform="rotate(90 683 165)">gutter</text>
  <rect class="prose" x="185" y="50" width="350" height="62" rx="8"/>
  <text class="label" x="360" y="78" text-anchor="middle">prose column</text>
  <text class="small" x="360" y="99" text-anchor="middle">max-inline-size: 45rem</text>
  <path class="measure" d="M58 143V155M662 143V155M58 149H662"/>
  <text class="small" x="360" y="139" text-anchor="middle">page content width</text>
  <rect class="widget" x="58" y="167" width="604" height="108" rx="8"/>
  <text class="label" x="360" y="206" text-anchor="middle">block widget</text>
  <text class="ink" x="360" y="231" text-anchor="middle">inline-size: 100% · min-inline-size: 0 · natural block size</text>
  <text class="small" x="360" y="255" text-anchor="middle">content cap: 2160 CSS px, excluding gutters</text>
  <text class="small" x="360" y="298" text-anchor="middle">responsive content width, independent of the browser screen</text>
</svg>
