<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
  <title id="title">Default and wide widget width allocation</title>
  <desc id="desc">A centered page has responsive gutters. Direct body children have a 45rem maximum. A separate wide widget fills the page content width after an authored document rule removes the widget's maximum.</desc>
  <style>
    .ink { fill: #1f2937; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #4b5563; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .label { fill: #075985; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
    .gutter { fill: #e2e8f0; }
    .prose { fill: #dbeafe; stroke: #60a5fa; stroke-width: 2; }
    .widget { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; }
    .wide { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
  </style>
  <rect width="720" height="430" fill="#ffffff"/>
  <rect class="page" x="16" y="16" width="688" height="398" rx="12"/>
  <rect class="gutter" x="16" y="16" width="42" height="398"/>
  <rect class="gutter" x="662" y="16" width="42" height="398"/>
  <text class="small" x="37" y="215" text-anchor="middle" transform="rotate(-90 37 215)">gutter</text>
  <text class="small" x="683" y="215" text-anchor="middle" transform="rotate(90 683 215)">gutter</text>

  <rect class="prose" x="185" y="42" width="350" height="64" rx="8"/>
  <text class="label" x="360" y="70" text-anchor="middle">prose column</text>
  <text class="small" x="360" y="92" text-anchor="middle">max-inline-size: 45rem</text>

  <rect class="widget" x="185" y="126" width="350" height="82" rx="8"/>
  <text class="label" x="360" y="158" text-anchor="middle">default block widget</text>
  <text class="small" x="360" y="182" text-anchor="middle">same 45rem maximum</text>

  <rect class="wide" x="58" y="236" width="604" height="126" rx="8"/>
  <text class="label" x="360" y="271" text-anchor="middle">wide block widget</text>
  <text class="ink" x="360" y="297" text-anchor="middle">max-inline-size: unset</text>
  <text class="small" x="360" y="321" text-anchor="middle">authored document opt-out for a body child</text>
  <text class="small" x="360" y="347" text-anchor="middle">natural block sizing uses the page content width</text>
  <text class="small" x="360" y="394" text-anchor="middle">page content cap: 2160 CSS px, excluding gutters</text>
</svg>
