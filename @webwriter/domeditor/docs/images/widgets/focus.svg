<svg xmlns="http://www.w3.org/2000/svg" width="360" height="224" viewBox="0 0 360 224" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard focus moves between native controls</title>
  <desc id="desc">The first button has a visible focus ring. The Tab key moves focus to the next button.</desc>
  <g fill="none" stroke="#0f2f48" stroke-width="3" stroke-linejoin="round">
    <rect x="60" y="42" width="240" height="110" rx="4"/>
    <path d="M84 66h64"/>
    <rect x="84" y="90" width="76" height="36" rx="4"/>
    <rect x="200" y="90" width="76" height="36" rx="4"/>
    <path d="M102 108h40M218 108h40"/>
    <rect x="152" y="170" width="56" height="30" rx="4"/>
  </g>
  <rect x="78" y="84" width="88" height="48" rx="7" fill="#82d0f5" fill-opacity=".2" stroke="#29a3dd" stroke-width="2"/>
  <path d="M176 108h14m-6-6 6 6-6 6" fill="none" stroke="#29a3dd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="190" fill="#0f2f48" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Tab</text>
</svg>
