<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>DOM editor performance checks</title>
<script>
const reportFailure = error => fetch('/__native-result', {method: 'POST', body: JSON.stringify({error: String(error)})})
addEventListener('error', event => reportFailure(event.error ?? event.message))
addEventListener('unhandledrejection', event => reportFailure(event.reason))
</script>
<script type="module">import('./performance.ts').catch(reportFailure)</script>
<body></body>
</html>
