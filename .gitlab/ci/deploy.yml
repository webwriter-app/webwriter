# Deploy-Pipeline von WebWriter (Child-Pipeline von deploy:staging, nur auf staging).
# gitops:staging triggert edumix-cluster auf dessen Branch dev; von dort promotet edumix-cluster
# selbst nach seinem staging, aus dem Flux liest.
# Kopie von edumix-cluster ci/templates/deploy.gitlab-ci.yml (Version 1); Image-Job am Ende.
# Kubernetes-Manifeste und erlaubte Images: edumix-cluster apps/webwriter.
stages: [build, gitops]

default:
  interruptible: true
  tags:
    - node4-ci

variables:
  BUILDAH_IMAGE: quay.io/buildah/stable:v1.43.5

# Ein Job je Image (extends: .edumix:image).
.edumix:image:
  stage: build
  image: $BUILDAH_IMAGE
  # Eigener, geschützter Runner: buildah braucht CAP_SYS_ADMIN und AppArmor unconfined,
  # das bekommen nur Pipelines geschützter Branches (Runner-Option „Protected“).
  tags:
    - node4-build
  variables:
    IMAGE_NAME: ""
    IMAGE_CONTEXT: .
    IMAGE_DOCKERFILE: Dockerfile
    IMAGE_BUILD_ARGS: ""
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: vfs
  script:
    - |
      set -eu
      # Kurznamen in FROM (z. B. oven/bun) ohne TTY-Rückfrage auflösen: nur Docker Hub.
      mkdir -p /etc/containers/registries.conf.d
      printf '%s\n' 'unqualified-search-registries = ["docker.io"]' 'short-name-mode = "permissive"' \
        > /etc/containers/registries.conf.d/99-edumix.conf
      image="$CI_REGISTRY_IMAGE${IMAGE_NAME:+/$IMAGE_NAME}"
      args=""
      for a in $IMAGE_BUILD_ARGS; do args="$args --build-arg $a"; done
      # shellcheck disable=SC2086
      # Der Job-Container erlaubt nofile nur bis 524288; buildahs Standard 1048576 scheitert.
      buildah build --pull --layers=false --ulimit nofile=65536:65536 \
        --label "org.opencontainers.image.source=$CI_PROJECT_URL" \
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" \
        -f "$IMAGE_CONTEXT/$IMAGE_DOCKERFILE" -t "$image:$CI_COMMIT_SHA" $args "$IMAGE_CONTEXT"
      printf '%s' "$CI_REGISTRY_PASSWORD" | buildah login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      buildah push --digestfile digest "$image:$CI_COMMIT_SHA"
      mkdir -p .edumix/images
      # Unveränderliche Referenz; der Tag dient nur der Lesbarkeit in der Registry.
      printf '%s@%s\n' "$image" "$(cat digest)" > ".edumix/images/$CI_JOB_ID.ref"
      cat ".edumix/images/$CI_JOB_ID.ref"
  artifacts:
    paths: [.edumix/images/]
    expire_in: 1 week

# Sammelt die Digests aller Image-Jobs für den Trigger.
gitops:collect:
  stage: gitops
  image: alpine:3.22
  script:
    - |
      set -eu
      refs=$(cat .edumix/images/*.ref | sort -u | tr '\n' ' ')
      printf 'GITOPS_IMAGES=%s\n' "$refs" > gitops.env
      cat gitops.env
  artifacts:
    reports:
      dotenv: gitops.env

# Übergibt die Digests an edumix-cluster und wartet auf dessen gitops:update-Job.
gitops:staging:
  stage: gitops
  needs: [gitops:collect]
  inherit:
    variables: false
  variables:
    GITOPS_APP: $GITOPS_APP
    GITOPS_IMAGES: $GITOPS_IMAGES
    GITOPS_SOURCE: $CI_PROJECT_PATH@$CI_COMMIT_SHA
  trigger:
    project: edumix/infrastructure/edumix-cluster
    branch: dev
    strategy: depend
  resource_group: edumix-gitops-$GITOPS_APP

# Ein Image für Staging und Production: keine Origins beim Build. Kubernetes setzt APP_ORIGIN,
# EDITOR_ORIGIN und EDUMIX_URL je Umgebung zur Laufzeit (Caddy liefert sie als
# /runtime-config.js aus; edumix-cluster apps/webwriter). Fehlen sie, scheitern die
# Editor-Frames sichtbar, statt still auf eine andere Umgebung zu zeigen.
image:webwriter:
  extends: .edumix:image
  variables:
    IMAGE_NAME: ""
    IMAGE_CONTEXT: .
